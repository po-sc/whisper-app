name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Whisper ${{ github.ref_name }}"
          releaseBody: |
            ## Установка

            ### macOS (Apple Silicon)
            Скачай `Whisper_*_aarch64.dmg`

            ### macOS (Intel)
            Скачай `Whisper_*_x64.dmg`

            ### Windows
            Скачай `Whisper_*_x64-setup.exe`

            ## Требования
            - Python 3.x с установленным `openai-whisper`:
              ```
              pip install openai-whisper
              ```
            - ffmpeg (для видеофайлов):
              - macOS: `brew install ffmpeg`
              - Windows: [ffmpeg.org](https://ffmpeg.org/download.html)
            - Транскрипционный скрипт по пути `~/Documents/CLAUDE/whisper-transcription/transcribe.py`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
